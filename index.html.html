            <p class="text-slate-500 mt-2 text-sm">Escribe un nombre o apellido para buscar</p>
        </div>

        <div class="space-y-4">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Ej. Perez o Juan" 
                class="w-full p-4 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
                oninput="checkPadron()"
            >
        </div>

        <div id="resultsContainer" class="mt-6 hidden">
            <div id="resultsList" class="space-y-3 results-scroll max-h-[400px] overflow-y-auto pr-2">
                <!-- Los resultados aparecerán aquí -->
            </div>
            
            <div id="footerMsg" class="mt-6 p-4 rounded-xl bg-blue-50 border border-blue-100 text-sm text-blue-800 text-center">
                ¿No encontraste lo que buscabas? Acércate al Telecentro Shapaja con tu DNI para asistencia personalizada.
            </div>
        </div>
    </div>

    <script>
        function checkPadron() {
            const input = document.getElementById('searchInput').value.toUpperCase().trim();
            const container = document.getElementById('resultsContainer');
            const list = document.getElementById('resultsList');
            
            if (input.length < 2) {
                container.classList.add('hidden');
                return;
            }

            // Filtramos los resultados que coincidan
            const filtered = PADRON_DATA.filter(person => 
                person.nombre.includes(input)
            );

            list.innerHTML = '';
            
            if (filtered.length > 0) {
                filtered.forEach(person => {
                    const div = document.createElement('div');
                    div.className = "p-4 bg-white border border-slate-200 rounded-xl hover:border-blue-300 transition-all shadow-sm";
                    div.innerHTML = `
                        <div class="font-bold text-slate-800">${person.nombre}</div>
                        <div class="text-xs text-slate-500 mt-1 uppercase tracking-wider">${person.localidad} - ${person.distrito}</div>
                        <div class="mt-2 text-emerald-600 text-xs font-semibold">✅ Encontrado en el padrón</div>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = `<div class="p-4 text-center text-slate-500">No se encontraron resultados para "${input}"</div>`;
            }

            container.classList.remove('hidden');
        }
    </script>
</body>
</html>
